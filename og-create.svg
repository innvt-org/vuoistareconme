<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6c63d8"/>
      <stop offset="100%" stop-color="#3d35a0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="32" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cardshadow">
      <feDropShadow dx="0" dy="16" stdDeviation="32" flood-color="#2a2480" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Sfondo viola -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Cerchi decorativi -->
  <circle cx="80"  cy="80"  r="160" fill="#ffffff" opacity="0.05"/>
  <circle cx="1120" cy="550" r="200" fill="#ffffff" opacity="0.05"/>
  <circle cx="1050" cy="100" r="100" fill="#ffffff" opacity="0.07"/>
  <circle cx="150"  cy="560" r="130" fill="#ffffff" opacity="0.06"/>

  <!-- Card bianca centrale -->
  <rect x="100" y="120" width="1000" height="390" rx="32" fill="white" filter="url(#cardshadow)"/>

  <!-- Emoji grande -->
  <text x="600" y="285" text-anchor="middle" font-size="100">❓</text>

  <!-- Brand -->
  <text x="600" y="365" text-anchor="middle"
        font-family="Georgia, 'Palatino Linotype', serif"
        font-size="52" font-weight="bold" font-style="italic"
        fill="#534ab7" letter-spacing="-1">vuoistarecon.me</text>

  <!-- CTA -->
  <text x="600" y="430" text-anchor="middle"
        font-family="system-ui, -apple-system, Arial, sans-serif"
        font-size="28" font-weight="600" fill="#3d35a0">Crea il tuo messaggio segreto</text>

  <!-- Pill in basso -->
  <rect x="400" y="465" width="400" height="50" rx="25" fill="#534ab7"/>
  <text x="600" y="496" text-anchor="middle"
        font-family="system-ui, -apple-system, Arial, sans-serif"
        font-size="20" font-weight="700" fill="white">Inizia ora — è gratis</text>
</svg>
