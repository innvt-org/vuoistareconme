<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>vuoistareconme</title>
<meta property="og:type"        content="website">
<meta property="og:site_name"   content="vuoistarecon.me">
<meta property="og:url"         content="https://vuoistarecon.me/notify.html">
<meta property="og:title"       content="Hai ricevuto una risposta — vuoistarecon.me">
<meta property="og:description" content="Qualcuno ha risposto al tuo messaggio. Scopri cosa ti ha scritto!">
<meta property="og:image"       content="https://vuoistarecon.me/og-notify.png">
<meta name="twitter:card"        content="summary_large_image">
<meta name="twitter:title"       content="Hai ricevuto una risposta — vuoistarecon.me">
<meta name="twitter:description" content="Qualcuno ha risposto al tuo messaggio. Scopri cosa ti ha scritto!">
<meta name="twitter:image"       content="https://vuoistarecon.me/og-notify.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>❓</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  body { justify-content: center; min-height: 100vh; padding: 20px; }
  #app { width: min(calc(100vw - 40px), 440px); display: flex; flex-direction: column; }

  .notify-logo {
    font-family: 'Pacifico', cursive;
    font-size: 24px;
    color: var(--accent);
    text-align: center;
    padding: 16px 0 14px;
    transition: color 0.25s;
  }

  .teaser-body { padding: 8px 0 4px; }
  .teaser-line     { font-family: 'Pacifico', cursive; font-size: clamp(20px, 5.5vw, 28px); margin: 0; transition: color 0.25s; }
  .teaser-receiver { text-align: left;   color: var(--text); }
  .teaser-msg      { text-align: center; color: var(--accent); padding: 16px 10%; line-height: 1.55; }
  .teaser-btn-wrap { text-align: center; }
  .teaser-btn  {
    display: inline-block; margin-top: 24px;
    padding: 11px 24px; border-radius: 100px; border: none;
    background: var(--btn-bg); color: var(--btn-text);
    font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer;
    transition: opacity 0.15s, transform 0.12s, background 0.25s, color 0.25s;
  }
  .teaser-btn:hover { opacity: 0.85; transform: translateY(-1px); }
  .teaser-btn:active { transform: scale(0.97); }

  .notify-card { box-shadow: 0 6px 32px rgba(0,0,0,0.13); }

  .notify-hero  { font-family: 'Pacifico', cursive; margin: 8px 0 0; line-height: 1.55; }
  .nh-line      { font-size: clamp(20px, 5.5vw, 28px); margin: 0; transition: color 0.25s; }
  .nh-receiver  { text-align: left;   color: var(--text); }
  .nh-headline  { text-align: center; color: var(--accent); padding: 16px 10%; }
  .nh-answer    { color: var(--text); }
  .nh-extra     { text-align: center; color: var(--accent); padding: 8px 10% 0; font-size: clamp(18px, 4.5vw, 24px); }

  @keyframes fade-out { to { opacity: 0; transform: scale(0.96); } }
  @keyframes slide-in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  .is-out { animation: fade-out 0.2s ease forwards; pointer-events: none; }
  .is-in  { animation: slide-in 0.35s cubic-bezier(0.22, 1, 0.36, 1) both; }
</style>
</head>
<body>
<div id="app"></div>
<footer class="site-footer">© 2026 vuoistareconme — <a href="https://www.gnu.org/licenses/agpl-3.0.html" target="_blank" rel="noopener">AGPL</a></footer>
<script src="lz-string.min.js"></script>
<script src="payload.js"></script>
<script>
  const token     = VSCM.getParam('t');
  const answerIdx = VSCM.getParam('a');
  const freeMsg   = VSCM.getParam('m');
  const extraNote = VSCM.getParam('n');
  const extraLink = VSCM.getParam('k');
  const extraImg  = VSCM.getParam('g');
  const app       = document.getElementById('app');

  function showError() {
    app.innerHTML = `
      <div class="card error-box">
        <p style="font-size:15px;margin:0 0 6px">Link non valido o incompleto.</p>
        <p class="hint">Chiedi a chi te l'ha mandato di inviarlo di nuovo.</p>
      </div>`;
  }

  function showLockedTeaser(teaser, wrongPassword) {
    app.innerHTML = `
      <div class="notify-logo">vuoistareconme</div>
      <div class="card center-card notify-card" id="teaser">
        <div class="teaser-body">${buildNotifyTeaserBody(teaser, wrongPassword)}</div>
      </div>`;
    VSCM.bindTeaserPassword(async (pw) => {
      const result = await VSCM.decode(token, pw);
      if (!result || result.locked) {
        showLockedTeaser(result?.teaser || teaser, true);
        return false;
      }
      runApp(result.payload, true);
      return true;
    });
  }

  function buildNotifyTeaserBody(meta, wrongPassword) {
    const s = meta?.s || '';
    const r = meta?.r || '';
    if (wrongPassword != null) {
      return `
        ${s ? `<p class="teaser-line teaser-receiver">${esc(s)},</p>` : ''}
        <p class="teaser-line teaser-msg">${r ? `<span style="color:var(--text)">${esc(r)}</span> ha risposto` : 'Qualcuno ha risposto'}</p>
        ${VSCM.teaserPasswordFormHtml(wrongPassword, 'Inserisci la password per vederla')}`;
    }
    return `
      ${s ? `<p class="teaser-line teaser-receiver">${esc(s)},</p>` : ''}
      <p class="teaser-line teaser-msg">${r ? `<span style="color:var(--text)">${esc(r)}</span> ha risposto` : 'Qualcuno ha risposto'}</p>
      <div class="teaser-btn-wrap"><button class="teaser-btn" id="reveal-btn">Clicca qui per vedere</button></div>`;
  }

  function runApp(payload, revealNow) {
    const isFreeText = answerIdx === 'ft';
    const idx        = parseInt(answerIdx, 10);
    const chosen     = isFreeText
      ? (payload && payload.ft)
      : (payload && payload.o && !isNaN(idx) ? payload.o[idx] : null);

    if (!payload || !chosen || answerIdx == null) {
      showError();
      return;
    }

    if (payload.th && payload.th !== 'violet') {
      document.body.setAttribute('data-theme', payload.th);
    }

    const answerLabel = isFreeText ? (freeMsg || '') : (chosen.label || '');
    const icon = chosen.icon || (isFreeText ? '✍️' : iconFallback(chosen.label));

    const extraImgHtml = extraImg ? renderImg(extraImg) : '';
    const extraNoteHtml = extraNote
      ? `<p class="nh-line nh-extra">${esc(extraNote)}</p>`
      : '';
    const { svg: pSvg, label: pLabel } = platformInfo(extraLink);
    const extraLinkHtml = extraLink
      ? `<a href="${escAttr(extraLink)}" target="_blank" rel="noopener" class="continue-btn">${pSvg}${pLabel}</a>`
      : '';

    const contentHtml = `
      <div class="notify-logo">vuoistareconme</div>
      <div class="card center-card notify-card is-in">
        ${extraImgHtml}
        <span class="reply-icon">${esc(icon)}</span>
        <div class="notify-hero">
          ${payload.s ? `<p class="nh-line nh-receiver">${esc(payload.s)},</p>` : ''}
          <p class="nh-line nh-headline">${payload.r ? esc(payload.r) + ' ha risposto' : 'Qualcuno ha risposto'} <span class="nh-answer">${esc(answerLabel)}</span></p>
          ${extraNoteHtml}
        </div>
        ${extraLinkHtml}
        <div class="privacy-note">${VSCM.isLocked(token) ? 'La password protegge il contenuto della risposta, non chi ha risposto.' : 'Questa pagina è visibile a chiunque abbia il link.'}</div>
      </div>`;

    if (revealNow) {
      app.innerHTML = contentHtml;
      return;
    }

    app.innerHTML = `
      <div class="notify-logo">vuoistareconme</div>
      <div class="card center-card notify-card" id="teaser">
        <div class="teaser-body">${buildNotifyTeaserBody(payload)}</div>
      </div>`;

    document.getElementById('reveal-btn').addEventListener('click', () => {
      document.getElementById('teaser').classList.add('is-out');
      setTimeout(() => { app.innerHTML = contentHtml; }, 200);
    });
  }

  (async () => {
    if (!token || answerIdx == null) { showError(); return; }
    const result = await VSCM.decode(token);
    if (!result) { showError(); return; }
    if (result.locked) { showLockedTeaser(result.teaser, false); return; }
    runApp(result.payload);
  })();

  function iconFallback(label) {
    const l = (label || '').toLowerCase();
    if (l.includes('sì') || l.includes('si')) return '❤️';
    if (l.includes('no')) return '💔';
    return '💬';
  }

  const WA_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" style="vertical-align:middle;margin-right:6px;flex-shrink:0"><path fill="currentColor" d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>`;

  function platformInfo(url) {
    if (!url) return { svg: '', label: 'Apri il link' };
    if (url.includes('wa.me') || url.includes('whatsapp.com'))
      return { svg: WA_SVG,  label: 'Scrivimi su WhatsApp' };
    if (url.includes('instagram.com'))
      return { svg: '📸 ', label: 'Scrivimi su Instagram' };
    if (url.includes('t.me'))
      return { svg: '✈️ ',  label: 'Scrivimi su Telegram' };
    if (url.includes('snapchat.com'))
      return { svg: '👻 ', label: 'Aggiungimi su Snapchat' };
    if (url.includes('tiktok.com'))
      return { svg: '🎵 ', label: 'Seguimi su TikTok' };
    if (url.includes('facebook.com') || url.includes('fb.me') || url.includes('m.me'))
      return { svg: '👤 ', label: 'Scrivimi su Facebook' };
    if (url.includes('twitter.com') || url.includes('x.com'))
      return { svg: '🐦 ', label: 'Scrivimi su X' };
    if (url.includes('youtube.com') || url.includes('youtu.be'))
      return { svg: '📺 ', label: 'Guardami su YouTube' };
    if (url.includes('discord.gg') || url.includes('discord.com'))
      return { svg: '🎮 ', label: 'Unisciti su Discord' };
    if (url.includes('signal.me') || url.includes('signal.group'))
      return { svg: '🔒 ', label: 'Scrivimi su Signal' };
    if (url.includes('linkedin.com'))
      return { svg: '💼 ', label: 'Connettiti su LinkedIn' };
    return { svg: '→ ',   label: 'Apri il link' };
  }

  function renderImg(raw) {
    const { url, type, ytId } = VSCM.resolveImg(raw);
    if (type === 'youtube') {
      return `<div class="card-video-wrap"><iframe class="card-video"
        src="https://www.youtube.com/embed/${escAttr(ytId)}"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; picture-in-picture"
        allowfullscreen></iframe></div>`;
    }
    if (!url) return '';
    return `<img class="card-img-header" src="${escAttr(url)}" alt="">`;
  }

  function esc(str) {
    const d = document.createElement('div');
    d.textContent = str || '';
    return d.innerHTML;
  }
  function escAttr(str) { return (str || '').replace(/"/g, '&quot;'); }
</script>
</body>
</html>
