<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>vuoistareconme — risposta</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>❓</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  body { justify-content: center; min-height: 100vh; padding: 20px; }
  #app { width: min(calc(100vw - 40px), 440px); display: flex; flex-direction: column; }

  .reply-logo {
    font-family: 'Pacifico', cursive;
    font-size: 24px;
    color: var(--accent);
    text-align: center;
    padding: 16px 0 14px;
    transition: color 0.25s;
  }

  /* Teaser */
  .teaser-body { text-align: center; padding: 8px 0 4px; }
  .teaser-addr { font-family: 'Pacifico', cursive; font-size: clamp(26px, 7vw, 36px); color: var(--text); margin: 0; transition: color 0.25s; }
  .teaser-msg  { font-size: 15px; color: var(--text-secondary); margin: 10px 0 0; line-height: 1.55; transition: color 0.25s; }
  .teaser-btn  {
    display: inline-block; margin-top: 24px;
    padding: 11px 24px; border-radius: 100px; border: none;
    background: var(--btn-bg); color: var(--btn-text);
    font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer;
    transition: opacity 0.15s, transform 0.12s, background 0.25s, color 0.25s;
  }
  .teaser-btn:hover { opacity: 0.85; transform: translateY(-1px); }
  .teaser-btn:active { transform: scale(0.97); }

  .brand { font-family: 'Pacifico', cursive; font-size: 22px; color: var(--accent); margin-bottom: 18px; display: block; transition: color 0.25s; }

  /* Animazioni */
  @keyframes fade-out { to { opacity: 0; transform: scale(0.96); } }
  @keyframes slide-in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  .is-out { animation: fade-out 0.2s ease forwards; pointer-events: none; }
  .is-in  { animation: slide-in 0.35s cubic-bezier(0.22, 1, 0.36, 1) both; }
</style>
</head>
<body>
<div id="app"></div>
<script src="lz-string.min.js"></script>
<script src="payload.js"></script>
<script>
  const token     = VSCM.getParam('t');
  const answerIdx = VSCM.getParam('a');
  const freeMsg   = VSCM.getParam('m');
  const payload   = VSCM.decode(token);
  const app       = document.getElementById('app');

  const isFreeText = answerIdx === 'ft';
  const idx        = parseInt(answerIdx, 10);
  const chosen     = isFreeText
    ? (payload && payload.ft)
    : (payload && payload.o && !isNaN(idx) ? payload.o[idx] : null);

  if (!payload || !chosen) {
    app.innerHTML = `
      <div class="card error-box">
        <p style="font-size:15px;margin:0 0 6px">Risposta non trovata.</p>
        <p class="hint">Il link potrebbe essere incompleto o non valido.</p>
      </div>
    `;
  } else {
    if (payload.th && payload.th !== 'violet') {
      document.body.setAttribute('data-theme', payload.th);
    }

    const icon = chosen.icon || (isFreeText ? '✍️' : iconFallback(chosen.label));

    const pairHtml = (payload.s || payload.r)
      ? `<div class="sender-tag">${esc(payload.s)}${payload.s && payload.r ? ' ↔ ' : ''}${esc(payload.r)}</div>`
      : '';

    const questionHtml = payload.q
      ? `<div class="reply-label">${esc(payload.q)}</div>`
      : '';

    const continueHtml = chosen.link
      ? `<a href="${escAttr(chosen.link)}" target="_blank" rel="noopener" class="continue-btn">
           ${platformIcon(chosen.link)} Continua
         </a>`
      : '';

    const contentHtml = `
      <div class="reply-logo">vuoistareconme</div>
      <div class="card center-card is-in">
        ${chosen.img ? `<img class="card-img-header" src="${escAttr(chosen.img)}" alt="">` : ''}
        <span class="brand">vuoistareconme</span>
        ${pairHtml}
        ${questionHtml}
        <span class="reply-icon">${esc(icon)}</span>
        ${isFreeText && freeMsg ? `<div class="ft-reply-quote">${esc(freeMsg)}</div>` : ''}
        <div class="reply-msg">${esc(chosen.msg || chosen.label)}</div>
        ${continueHtml}
        <div class="privacy-note">Questa pagina è visibile a chiunque abbia il link, senza login.</div>
        <div class="privacy-note" style="margin-top:10px">
          <a href="${VSCM.buildUrl('edit.html', { t: token })}" style="color:var(--text-tertiary)">✏️ Modifica questo link</a>
        </div>
      </div>`;

    function revealContent() {
      document.getElementById('teaser').classList.add('is-out');
      setTimeout(() => { app.innerHTML = contentHtml; }, 200);
    }

    const teaserMsg = payload.r
      ? `${esc(payload.r)} ti ha risposto`
      : 'hai ricevuto una risposta';

    app.innerHTML = `
      <div class="reply-logo">vuoistareconme</div>
      <div class="card center-card" id="teaser">
        <div class="teaser-body">
          ${payload.s ? `<p class="teaser-addr">${esc(payload.s)},</p>` : ''}
          <p class="teaser-msg">${teaserMsg}</p>
          <button class="teaser-btn" id="reveal-btn">Clicca qui per vedere</button>
        </div>
      </div>`;

    document.getElementById('reveal-btn').addEventListener('click', revealContent);
  }

  function iconFallback(label) {
    const l = (label || '').toLowerCase();
    if (l.includes('sì') || l.includes('si')) return '❤️';
    if (l.includes('no'))                       return '💔';
    return '💬';
  }

  function platformIcon(url) {
    if (!url) return '';
    if (url.includes('wa.me'))         return '📱';
    if (url.includes('instagram.com')) return '📸';
    if (url.includes('t.me'))          return '✈️';
    if (url.includes('snapchat.com'))  return '👻';
    return '→';
  }

  function esc(str) {
    const d = document.createElement('div');
    d.textContent = str || '';
    return d.innerHTML;
  }
  function escAttr(str) { return (str || '').replace(/"/g, '&quot;'); }
</script>
</body>
</html>
