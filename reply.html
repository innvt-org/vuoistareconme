<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>vuoistareconme — risposta</title>
<meta property="og:type"        content="website">
<meta property="og:site_name"   content="vuoistarecon.me">
<meta property="og:url"         content="https://vuoistarecon.me/reply.html">
<meta property="og:title"       content="Hai ricevuto una risposta — vuoistarecon.me">
<meta property="og:description" content="Scopri la risposta al tuo messaggio su vuoistarecon.me">
<meta property="og:image"       content="https://vuoistarecon.me/og-discover.png">
<meta name="twitter:card"        content="summary_large_image">
<meta name="twitter:title"       content="Hai ricevuto una risposta — vuoistarecon.me">
<meta name="twitter:description" content="Scopri la risposta al tuo messaggio su vuoistarecon.me">
<meta name="twitter:image"       content="https://vuoistarecon.me/og-discover.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>❓</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  body { justify-content: center; min-height: 100vh; padding: 20px; }
  #app { width: min(calc(100vw - 40px), 440px); display: flex; flex-direction: column; }

  .reply-logo {
    font-family: 'Pacifico', cursive;
    font-size: 24px;
    color: var(--accent);
    text-align: center;
    padding: 16px 0 14px;
    transition: color 0.25s;
  }

  .share-reply-btn {
    display: block; width: 100%; margin-top: 20px;
    padding: 13px 20px; border-radius: 100px; border: none;
    background: var(--btn-bg); color: var(--btn-text);
    font-size: 15px; font-weight: 600; font-family: inherit; cursor: pointer;
    transition: opacity 0.15s, transform 0.12s, background 0.25s;
  }
  .share-reply-btn:hover  { opacity: 0.85; transform: translateY(-1px); }
  .share-reply-btn:active { transform: scale(0.97); }

  .teaser-body { padding: 8px 0 4px; }
  .teaser-line     { font-family: 'Pacifico', cursive; font-size: clamp(20px, 5.5vw, 28px); margin: 0; transition: color 0.25s; }
  .teaser-receiver { text-align: left;   color: var(--text); }
  .teaser-msg      { text-align: center; color: var(--accent); padding: 16px 10%; line-height: 1.55; }

  /* Blocco risposta */
  .reply-hero  { font-family: 'Pacifico', cursive; margin: 8px 0 0; line-height: 1.55; }
  .rh-line     { font-size: clamp(20px, 5.5vw, 28px); margin: 0; transition: color 0.25s; }
  .rh-receiver { text-align: left;   color: var(--text); }
  .rh-msg      { text-align: center; color: var(--accent); padding: 16px 10%; }
  .rh-sender   { text-align: right;  color: var(--text); }

  .extra-section {
    margin-top: 20px; padding-top: 16px;
    border-top: 1px solid var(--border);
    text-align: left;
  }
  .extra-section .label { margin-top: 12px; }
  .extra-section .label:first-child { margin-top: 0; }
  .extra-img-preview { margin-top: 8px; border-radius: var(--radius-md); overflow: hidden; display: none; }
  .extra-img-preview img { width: 100%; max-height: 160px; object-fit: cover; display: block; }
  .extra-img-preview .img-hint { font-size: 12px; color: var(--text-secondary); padding: 6px 0 2px; line-height: 1.5; }

  /* Animazione entrata */
  @keyframes slide-in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  .is-in  { animation: slide-in 0.35s cubic-bezier(0.22, 1, 0.36, 1) both; }
</style>
</head>
<body>
<div id="app"></div>
<footer class="site-footer">© 2026 vuoistareconme — <a href="https://www.gnu.org/licenses/agpl-3.0.html" target="_blank" rel="noopener">AGPL</a></footer>
<script src="lz-string.min.js"></script>
<script src="payload.js"></script>
<script>
  const REPLY_KEY = 'vscm_reply';

  function loadReplyState() {
    try {
      const raw = localStorage.getItem(REPLY_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (_) { return null; }
  }

  function saveReplyState(state) {
    try { localStorage.setItem(REPLY_KEY, JSON.stringify(state)); } catch (_) {}
  }

  let token     = VSCM.getParam('t');
  let answerIdx = VSCM.getParam('a');
  let freeMsg   = VSCM.getParam('m');

  if (!token || answerIdx == null) {
    const saved = loadReplyState();
    if (saved?.t && saved.a != null) {
      const params = { t: saved.t, a: saved.a };
      if (saved.m) params.m = saved.m;
      location.replace(VSCM.buildUrl('reply.html', params));
    }
  }

  token     = VSCM.getParam('t');
  answerIdx = VSCM.getParam('a');
  freeMsg   = VSCM.getParam('m');

  const app = document.getElementById('app');

  function showError() {
    app.innerHTML = `
      <div class="card error-box">
        <p style="font-size:15px;margin:0 0 6px">Risposta non trovata.</p>
        <p class="hint">Il link potrebbe essere incompleto o non valido.</p>
      </div>`;
  }

  function showLockedTeaser(teaser, wrongPassword) {
    app.innerHTML = `
      <div class="reply-logo">vuoistareconme</div>
      <div class="card center-card" id="teaser">
        <div class="teaser-body">${buildReplyTeaserBody(teaser, wrongPassword)}</div>
      </div>`;
    VSCM.bindTeaserPassword(async (pw) => {
      const result = await VSCM.decode(token, pw);
      if (!result || result.locked) {
        showLockedTeaser(result?.teaser || teaser, true);
        return false;
      }
      runApp(result.payload);
      return true;
    });
  }

  function buildReplyTeaserBody(meta, wrongPassword) {
    const s = meta?.s || '';
    const r = meta?.r || '';
    if (wrongPassword != null) {
      return `
        ${r ? `<p class="teaser-line teaser-receiver">${esc(r)},</p>` : ''}
        <p class="teaser-line teaser-msg">${s ? `<span style="color:var(--text)">${esc(s)}</span> ti ha inviato un messaggio` : 'hai ricevuto un messaggio'}</p>
        ${VSCM.teaserPasswordFormHtml(wrongPassword, 'Inserisci la password per vederlo')}`;
    }
    return '';
  }

  function runApp(payload) {
    const isFreeText = answerIdx === 'ft';
    const idx        = parseInt(answerIdx, 10);
    const chosen     = isFreeText
      ? (payload && payload.ft)
      : (payload && payload.o && !isNaN(idx) ? payload.o[idx] : null);

    if (!payload || !chosen) {
      showError();
      return;
    }

    if (payload.th && payload.th !== 'violet') {
      document.body.setAttribute('data-theme', payload.th);
    }

    const locked = VSCM.isLocked(token);
    const icon = chosen.icon || (isFreeText ? '✍️' : iconFallback(chosen.label));
    const replyText = isFreeText ? (freeMsg || chosen.label) : (chosen.msg || chosen.label);

    const { svg: pSvg, label: pLabel } = platformInfo(chosen.link);
    const continueHtml = chosen.link
      ? `<a href="${escAttr(chosen.link)}" target="_blank" rel="noopener" class="continue-btn">${pSvg}${pLabel}</a>`
      : '';

    const shareHint = locked
      ? `<p class="privacy-note" style="margin-top:12px">${esc(payload.s) || 'Chi ti ha scritto'} potrà leggere la tua risposta con la <strong>stessa password</strong> del messaggio.</p>`
      : '';

    app.innerHTML = `
      <div class="reply-logo">vuoistareconme</div>
      <div class="card center-card is-in">
        ${chosen.img ? renderImg(chosen.img) : ''}
        <span class="reply-icon">${esc(icon)}</span>
        <div class="reply-hero">
          ${payload.r ? `<p class="rh-line rh-receiver">${esc(payload.r)},</p>` : ''}
          <p class="rh-line rh-msg">${esc(replyText)}</p>
          ${payload.s ? `<p class="rh-line rh-sender">${esc(payload.s)}</p>` : ''}
        </div>
        ${continueHtml}
        <div class="extra-section">
          <p class="label">Aggiungi qualcosa per ${esc(payload.s) || 'chi ti ha scritto'} (opzionale)</p>
          <p class="label">Messaggio</p>
          <textarea class="ft-textarea" id="extra-note" placeholder="…"></textarea>
          <p class="label">Link «Continua →»</p>
          <div class="link-builder">
            <select id="extra-link-type">
              <option value="">— nessun link —</option>
              <option value="wa">📱 WhatsApp</option>
              <option value="ig">📸 Instagram</option>
              <option value="tg">✈️ Telegram</option>
              <option value="sc">👻 Snapchat</option>
              <option value="url">🔗 URL libero</option>
            </select>
            <input type="text" id="extra-link-value" placeholder="" style="display:none">
            <span class="link-hint" id="extra-link-hint" style="display:none"></span>
          </div>
          <p class="label">Immagine</p>
          <input type="text" id="extra-img" placeholder="https://… (.jpg, .gif, …)">
          <div class="extra-img-preview" id="extra-img-preview"></div>
        </div>
        <button class="share-reply-btn" id="share-reply-btn">Invia la risposta a ${esc(payload.s) || 'chi ti ha scritto'}</button>
        ${shareHint}
        <div class="privacy-note">${locked ? 'Questa pagina è visibile a chiunque abbia il link e la password.' : 'Questa pagina è visibile a chiunque abbia il link, senza login.'}</div>
        <div class="privacy-note" style="margin-top:10px">
          <a href="${VSCM.buildUrl('edit.html', { t: token })}" style="color:var(--text-tertiary)">✏️ Modifica questo link</a>
        </div>
      </div>`;

    const LINK_TYPES = {
      wa:  { ph: 'numero es. 393391234567', hint: '→ wa.me/…',         build: v => `https://wa.me/${v.replace(/\D/g,'')}` },
      ig:  { ph: 'username (senza @)',      hint: '→ instagram.com/…', build: v => `https://instagram.com/${v.replace(/^@/,'')}` },
      tg:  { ph: 'username (senza @)',      hint: '→ t.me/…',          build: v => `https://t.me/${v.replace(/^@/,'')}` },
      sc:  { ph: 'username',                hint: '→ snapchat.com/add/…', build: v => `https://snapchat.com/add/${v}` },
      url: { ph: 'https://…',              hint: '',                   build: v => v }
    };

    const linkTypeEl = document.getElementById('extra-link-type');
    const linkValueEl = document.getElementById('extra-link-value');
    const linkHintEl = document.getElementById('extra-link-hint');
    const imgPreviewEl = document.getElementById('extra-img-preview');

    function syncLinkUi() {
      const type = linkTypeEl.value;
      const cfg = LINK_TYPES[type];
      if (!cfg) {
        linkValueEl.style.display = 'none';
        linkHintEl.style.display = 'none';
        return;
      }
      linkValueEl.style.display = '';
      linkValueEl.placeholder = cfg.ph;
      linkHintEl.style.display = cfg.hint ? '' : 'none';
      linkHintEl.textContent = cfg.hint;
    }

    function buildExtraLink() {
      const type = linkTypeEl.value;
      const value = linkValueEl.value.trim();
      if (!type || !value) return '';
      return LINK_TYPES[type].build(value);
    }

    function showExtraImgPreview() {
      const raw = document.getElementById('extra-img').value.trim();
      const { url, type, hint } = VSCM.resolveImg(raw);
      if (!raw) {
        imgPreviewEl.style.display = 'none';
        imgPreviewEl.innerHTML = '';
        return;
      }
      if (type === 'unsupported') {
        imgPreviewEl.style.display = '';
        imgPreviewEl.innerHTML = `<p class="img-hint">⚠️ ${hint}</p>`;
        return;
      }
      if (url) {
        imgPreviewEl.style.display = '';
        imgPreviewEl.innerHTML = `<img src="${escAttr(url)}" alt="" onerror="this.parentElement.innerHTML='<p class=\\'img-hint\\'>⚠️ Immagine non caricata.</p>';">`;
        return;
      }
      imgPreviewEl.style.display = 'none';
    }

    linkTypeEl.addEventListener('change', () => { syncLinkUi(); persistReply(); });
    linkValueEl.addEventListener('input', persistReply);
    document.getElementById('extra-note').addEventListener('input', persistReply);
    document.getElementById('extra-img').addEventListener('input', () => { showExtraImgPreview(); persistReply(); });
    syncLinkUi();

    function readExtraForm() {
      return {
        n: document.getElementById('extra-note').value,
        linkType: linkTypeEl.value,
        linkValue: linkValueEl.value,
        g: document.getElementById('extra-img').value,
      };
    }

    function persistReply() {
      saveReplyState({
        t: token,
        a: answerIdx,
        m: freeMsg || '',
        extra: readExtraForm(),
      });
    }

    const saved = loadReplyState();
    if (saved?.t === token && String(saved.a) === String(answerIdx) && saved.extra) {
      document.getElementById('extra-note').value = saved.extra.n || '';
      linkTypeEl.value = saved.extra.linkType || '';
      linkValueEl.value = saved.extra.linkValue || '';
      document.getElementById('extra-img').value = saved.extra.g || '';
      syncLinkUi();
      showExtraImgPreview();
    }

    persistReply();

    function buildNotifyUrl() {
      const params = { t: token, a: answerIdx };
      if (freeMsg) params.m = freeMsg;
      const note = document.getElementById('extra-note').value.trim();
      const link = buildExtraLink();
      const img = document.getElementById('extra-img').value.trim();
      if (note) params.n = note;
      if (link) params.k = link;
      if (img) params.g = img;
      return VSCM.buildUrl('notify.html', params);
    }

    document.getElementById('share-reply-btn').addEventListener('click', () => {
      const url = buildNotifyUrl();
      if (navigator.share) {
        navigator.share({ url });
      } else {
        navigator.clipboard.writeText(url).then(() => {
          const btn = document.getElementById('share-reply-btn');
          const orig = btn.textContent;
          btn.textContent = '✓ Link copiato!';
          setTimeout(() => { btn.textContent = orig; }, 2000);
        });
      }
    });
  }

  (async () => {
    if (!token || answerIdx == null) { showError(); return; }
    const result = await VSCM.decode(token);
    if (!result) { showError(); return; }
    if (result.locked) { showLockedTeaser(result.teaser, false); return; }
    runApp(result.payload);
  })();

  function iconFallback(label) {
    const l = (label || '').toLowerCase();
    if (l.includes('sì') || l.includes('si')) return '❤️';
    if (l.includes('no'))                       return '💔';
    return '💬';
  }

  const WA_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" style="vertical-align:middle;margin-right:6px;flex-shrink:0"><path fill="currentColor" d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>`;

  function platformInfo(url) {
    if (!url) return { svg: '', label: 'Apri il link' };
    if (url.includes('wa.me') || url.includes('whatsapp.com'))
      return { svg: WA_SVG,  label: 'Scrivimi su WhatsApp' };
    if (url.includes('instagram.com'))
      return { svg: '📸 ', label: 'Scrivimi su Instagram' };
    if (url.includes('t.me'))
      return { svg: '✈️ ',  label: 'Scrivimi su Telegram' };
    if (url.includes('snapchat.com'))
      return { svg: '👻 ', label: 'Aggiungimi su Snapchat' };
    if (url.includes('tiktok.com'))
      return { svg: '🎵 ', label: 'Seguimi su TikTok' };
    if (url.includes('facebook.com') || url.includes('fb.me') || url.includes('m.me'))
      return { svg: '👤 ', label: 'Scrivimi su Facebook' };
    if (url.includes('twitter.com') || url.includes('x.com'))
      return { svg: '🐦 ', label: 'Scrivimi su X' };
    if (url.includes('youtube.com') || url.includes('youtu.be'))
      return { svg: '📺 ', label: 'Guardami su YouTube' };
    if (url.includes('discord.gg') || url.includes('discord.com'))
      return { svg: '🎮 ', label: 'Unisciti su Discord' };
    if (url.includes('signal.me') || url.includes('signal.group'))
      return { svg: '🔒 ', label: 'Scrivimi su Signal' };
    if (url.includes('linkedin.com'))
      return { svg: '💼 ', label: 'Connettiti su LinkedIn' };
    return { svg: '→ ',   label: 'Apri il link' };
  }

  function renderImg(raw) {
    const { url, type, ytId } = VSCM.resolveImg(raw);
    if (type === 'youtube') {
      return `<div class="card-video-wrap"><iframe class="card-video"
        src="https://www.youtube.com/embed/${escAttr(ytId)}"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; picture-in-picture"
        allowfullscreen></iframe></div>`;
    }
    if (!url) return '';
    return `<img class="card-img-header" src="${escAttr(url)}" alt="">`;
  }

  function esc(str) {
    const d = document.createElement('div');
    d.textContent = str || '';
    return d.innerHTML;
  }
  function escAttr(str) { return (str || '').replace(/"/g, '&quot;'); }
</script>
</body>
</html>
