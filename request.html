<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>vuoistareconme</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>❓</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  body { justify-content: center; min-height: 100vh; padding: 20px; }
  #app { width: min(calc(100vw - 40px), 440px); display: flex; flex-direction: column; }

  .req-logo {
    font-family: 'Pacifico', cursive;
    font-size: 24px;
    color: var(--accent);
    text-align: center;
    padding: 16px 0 14px;
    transition: color 0.25s;
  }

  /* Teaser */
  .teaser-body { text-align: center; padding: 8px 0 4px; }
  .teaser-addr { font-family: 'Pacifico', cursive; font-size: clamp(26px, 7vw, 36px); color: var(--text); margin: 0; transition: color 0.25s; }
  .teaser-msg  { font-family: 'Pacifico', cursive; font-size: 15px; color: var(--text-secondary); margin: 10px 0 0; line-height: 1.55; transition: color 0.25s; }
  .teaser-btn  {
    display: inline-block; margin-top: 24px;
    padding: 11px 24px; border-radius: 100px; border: none;
    background: var(--btn-bg); color: var(--btn-text);
    font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer;
    transition: opacity 0.15s, transform 0.12s, background 0.25s, color 0.25s;
  }
  .teaser-btn:hover { opacity: 0.85; transform: translateY(-1px); }
  .teaser-btn:active { transform: scale(0.97); }

  /* Blocco domanda */
  .question-hero { font-family: 'Pacifico', cursive; margin: 0 0 24px; line-height: 1.55; }
  .qh-line { font-size: clamp(20px, 5.5vw, 28px); margin: 0; }
  .qh-receiver { color: var(--text);           transition: color 0.25s; }
  .qh-question { color: var(--accent);         transition: color 0.25s; }
  .qh-sender   { color: var(--text-secondary); transition: color 0.25s; }

  .req-card { box-shadow: 0 6px 32px rgba(0,0,0,0.13); }

  /* Animazioni */
  @keyframes fade-out { to { opacity: 0; transform: scale(0.96); } }
  @keyframes slide-in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  .is-out { animation: fade-out 0.2s ease forwards; pointer-events: none; }
  .is-in  { animation: slide-in 0.35s cubic-bezier(0.22, 1, 0.36, 1) both; }
</style>
</head>
<body>
<div id="app"></div>
<script src="lz-string.min.js"></script>
<script src="payload.js"></script>
<script>
  const token   = VSCM.getParam('t');
  const payload = VSCM.decode(token);
  const app     = document.getElementById('app');

  if (!payload || !payload.q || payload.o.length === 0) {
    app.innerHTML = `
      <div class="card error-box">
        <p style="font-size:15px;margin:0 0 6px">Link non valido o incompleto.</p>
        <p class="hint">Chiedi a chi te l'ha mandato di generarne uno nuovo.</p>
      </div>
    `;
  } else {
    if (payload.th && payload.th !== 'violet') {
      document.body.setAttribute('data-theme', payload.th);
    }

    // Pre-calcolo HTML della fase contenuto
    const heroHtml = `
      <div class="question-hero">
        ${payload.r ? `<p class="qh-line qh-receiver">${esc(payload.r)},</p>` : ''}
        <p class="qh-line qh-question">${esc(lcFirst(payload.q))}</p>
        ${payload.s ? `<p class="qh-line qh-sender">${esc(payload.s)}</p>` : ''}
      </div>`;

    const optionsHtml = payload.o.map((opt, i) => `
      <button class="opt-btn" data-idx="${i}">
        ${opt.icon ? `<span class="opt-btn-icon">${esc(opt.icon)}</span>` : ''}
        <span class="opt-btn-label">${esc(opt.label)}</span>
      </button>
    `).join('');

    const ftHtml = payload.ft != null ? `
      <div class="ft-section">
        <p class="ft-label">${esc(payload.ft.label || 'Scrivi la tua risposta')}</p>
        <textarea class="ft-textarea" id="ft-input" placeholder="…"></textarea>
        <button class="ft-send-btn" id="ft-send">Invia</button>
      </div>` : '';

    const footerHtml = `
      <div class="privacy-note">Nessun dato viene salvato — la risposta resta solo nel link successivo.</div>
      <div class="privacy-note" style="margin-top:10px">
        <a href="${VSCM.buildUrl('edit.html', { t: token })}" style="color:var(--text-tertiary)">✏️ Modifica questo link</a>
      </div>`;

    function attachHandlers() {
      app.querySelectorAll('.opt-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          window.location.href = VSCM.buildUrl('reply.html', { t: token, a: btn.getAttribute('data-idx') });
        });
      });
      const ftSend = document.getElementById('ft-send');
      if (ftSend) {
        ftSend.addEventListener('click', () => {
          const msg = document.getElementById('ft-input').value.trim();
          if (!msg) return;
          window.location.href = VSCM.buildUrl('reply.html', { t: token, a: 'ft', m: msg });
        });
      }
    }

    function revealContent() {
      document.getElementById('teaser').classList.add('is-out');
      setTimeout(() => {
        app.innerHTML = `
          <div class="req-logo">vuoistareconme</div>
          <div class="card center-card req-card is-in">
            ${payload.img ? `<img class="card-img-header" src="${escAttr(payload.img)}" alt="">` : ''}
            ${heroHtml}
            <div class="options">${optionsHtml}</div>
            ${ftHtml}
            ${footerHtml}
          </div>`;
        attachHandlers();
      }, 200);
    }

    const teaserMsg = payload.s
      ? `${esc(payload.s)} ti ha inviato un messaggio`
      : 'hai ricevuto un messaggio';

    app.innerHTML = `
      <div class="req-logo">vuoistareconme</div>
      <div class="card center-card req-card" id="teaser">
        <div class="teaser-body">
          ${payload.r ? `<p class="teaser-addr">${esc(payload.r)},</p>` : ''}
          <p class="teaser-msg">${teaserMsg}</p>
          <button class="teaser-btn" id="reveal-btn">Clicca qui per vederlo</button>
        </div>
      </div>`;

    document.getElementById('reveal-btn').addEventListener('click', revealContent);
  }

  function esc(str) {
    const d = document.createElement('div');
    d.textContent = str || '';
    return d.innerHTML;
  }
  function escAttr(str) { return (str || '').replace(/"/g, '&quot;'); }
  function lcFirst(str) { return str ? str.charAt(0).toLowerCase() + str.slice(1) : ''; }
</script>
</body>
</html>
